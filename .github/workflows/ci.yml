name: CI

# Solo pull_request: corre con el código del PR y sin acceso a secretos (threat-FEAT-017a R-01).
on: pull_request

# Token de solo lectura para todo el workflow; ningún job declara permisos propios (threat-FEAT-017a R-04).
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior (threat-FEAT-017a R-05).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Los tests corren siempre en modo mock, sin credenciales reales.
env:
  MOCK_MODE: "true"

# Tres etapas encadenadas: si una falla, las siguientes no corren.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Un job colgado no consume más de 10 minutos (threat-FEAT-017a R-05).
    timeout-minutes: 10
    steps:
      # Actions fijadas por SHA de commit, con el tag en comentario (threat-FEAT-017a R-02).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token no queda en .git/config al alcance del código del PR (threat-FEAT-017a R-03).
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run typecheck
        run: npm run typecheck

  unit:
    name: unit
    needs: lint
    runs-on: ubuntu-latest
    # Un job colgado no consume más de 10 minutos (threat-FEAT-017a R-05).
    timeout-minutes: 10
    steps:
      # Actions fijadas por SHA de commit, con el tag en comentario (threat-FEAT-017a R-02).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token no queda en .git/config al alcance del código del PR (threat-FEAT-017a R-03).
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run test:unit
        run: npm run test:unit

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    # Un job colgado no consume más de 10 minutos (threat-FEAT-017a R-05).
    timeout-minutes: 10
    steps:
      # Actions fijadas por SHA de commit, con el tag en comentario (threat-FEAT-017a R-02).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token no queda en .git/config al alcance del código del PR (threat-FEAT-017a R-03).
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run test:integration
        run: npm run test:integration
